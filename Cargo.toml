[package]
name = "jev-context-compaction"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Low-latency, verbatim Jev-guided compaction for agent transcripts"
readme = "README.md"

[features]
default = []
server = ["dep:axum", "tokio/net"]

[[bin]]
name = "jev-context-compaction-server"
path = "src/bin/server.rs"
required-features = ["server"]

[dependencies]
axum = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
typesafe-ai = { git = "https://github.com/PhiDung-hub/typesafe-rust", rev = "47b9e1ab25ba3ec8750129f6976c3e374342eef7" }
typesafe-ai-common = { git = "https://github.com/PhiDung-hub/typesafe-rust", rev = "47b9e1ab25ba3ec8750129f6976c3e374342eef7" }

[dev-dependencies]
dotenvy = "0.15"
httpmock = "0.8"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[workspace]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
